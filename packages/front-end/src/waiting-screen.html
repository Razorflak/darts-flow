<!doctype html>
<html lang="fr">
  <head>
    <link rel="stylesheet" type="text/css" href="waiting-screen.css" />
    <script type="module" src="./waiting-screen.ts"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta charset="utf-8" />
    <title>Match</title>
  </head>
  <body
    class="min-h-screen flex items-center justify-center bg-gray-100"
    onload="onPageLoad()"
  >
    <!-- Section en attente -->
    <section id="waitingSection" class="text-center space-y-4">
      <div class="text-lg font-medium text-gray-700">
        En attente du prochain match
      </div>
      <div class="spinner item-center"></div>
    </section>

    <!-- Section prochain match -->
    <section id="nextMatchSection" class="hidden text-center">
      <div class="text-lg font-medium text-gray-700">
        Prochain match : <span id="player1" class="font-bold">XXXXXXXXX</span> /
        <span id="player2" class="font-bold">XXXXXXXXX</span>
      </div>
      <button
        id="goButton"
        class="bg-blue-500 text-white font-bold py-2 px-4 rounded-lg text-lg hover:bg-blue-600"
        disabled
      >
        GO!
      </button>
    </section>
  </body>
</html>
